name: 功能建议
description: 提出一个改进或新功能
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请尽量描述使用场景，而不只是功能名称。
  - type: input
    id: version
    attributes:
      label: 当前版本
      placeholder: 例如 0.18.0
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考虑
  - type: checkboxes
    id: consent
    attributes:
      label: 确认
      options:
        - label: 我确认没有在内容中包含书籍正文、笔记或敏感个人信息
          required: true
