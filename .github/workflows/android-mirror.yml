name: Mirror Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Android version, for example 0.33.3
        required: true
      apk_url:
        description: Public GitHub release APK URL
        required: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK and build mirror archive
        env:
          VERSION: ${{ inputs.version }}
          APK_URL: ${{ inputs.apk_url }}
        run: |
          mkdir -p release-assets
          asset="Moyue.Android_${VERSION}_arm64.apk"
          zip_asset="${asset}.zip"
          curl -L --fail --retry 3 -o "release-assets/${asset}" "$APK_URL"
          # Aliyun OSS refuses to serve .apk files on its default endpoint,
          # so the OSS mirror is a zip of the same APK.
          (cd release-assets && zip -q "$zip_asset" "$asset")
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
          echo "ZIP_ASSET=${zip_asset}" >> "$GITHUB_ENV"
          echo "APK_URL=${APK_URL}" >> "$GITHUB_ENV"

      - name: Upload to OSS
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --quiet oss2
          @'
          import datetime
          import hashlib
          import json
          import os
          import oss2

          version = os.environ["VERSION"]
          asset = os.environ["ASSET"]
          zip_asset = os.environ["ZIP_ASSET"]
          apk_path = f"release-assets/{asset}"
          zip_path = f"release-assets/{zip_asset}"
          with open(apk_path, "rb") as handle:
              apk = handle.read()
          with open(zip_path, "rb") as handle:
              zipped = handle.read()
          apk_sha = hashlib.sha256(apk).hexdigest()
          zip_sha = hashlib.sha256(zipped).hexdigest()

          auth = oss2.Auth(
              os.environ["OSS_ACCESS_KEY_ID"],
              os.environ["OSS_ACCESS_KEY_SECRET"],
          )
          bucket = oss2.Bucket(auth, "https://oss-cn-hangzhou.aliyuncs.com", "moyue-release-files")
          bucket.put_object_from_file(f"updates/android/{zip_asset}", zip_path)

          base = "https://moyue-release-files.oss-cn-hangzhou.aliyuncs.com"
          manifest = {
              "version": version,
              "notes": f"墨阅 Android {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "arm64": {
                  "url": os.environ["APK_URL"],
                  "oss_zip": f"{base}/updates/android/{zip_asset}",
                  "sha256": apk_sha,
                  "zip_sha256": zip_sha,
                  "size": len(apk),
                  "min_sdk": 24,
              },
          }
          bucket.put_object(
              "updates/android/latest.json",
              json.dumps(manifest, ensure_ascii=False, indent=2).encode("utf-8"),
          )
          print("uploaded", zip_asset, apk_sha, zip_sha, len(apk))
          '@ | python -
