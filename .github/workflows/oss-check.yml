name: OSS check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload test object
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          python -m pip install --quiet oss2
          python - <<'PY'
          import os
          import oss2
          auth = oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"])
          bucket = oss2.Bucket(auth, "https://oss-cn-hangzhou.aliyuncs.com", "moyue-release-files")
          with open("site/README.md", "rb") as source:
              bucket.put_object("updates/_oss-check.txt", source)
          print("OSS upload OK")
          PY
