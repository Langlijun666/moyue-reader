name: Release

on:
  push:
    tags:
      - "local-v*"
      - "online-v*"
  workflow_dispatch:
    inputs:
      edition:
        description: "local or online"
        required: true
        default: "local"
      version:
        description: "version, e.g. 0.32.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve edition and version
        id: edition
        shell: pwsh
        run: |
          $edition = "${{ github.event.inputs.edition }}"
          $version = "${{ github.event.inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            if ($tag.StartsWith("local-v")) { $edition = "local"; $version = $tag.Substring(7) }
            elseif ($tag.StartsWith("online-v")) { $edition = "online"; $version = $tag.Substring(8) }
          }
          if ($edition -notin @("local", "online")) { throw "invalid edition" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "invalid version" }
          "EDITOR=$edition" | Out-File $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "TAG=$edition-v$version" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Sync edition version
        shell: pwsh
        run: |
          node scripts/sync-edition-version.mjs $env:EDITOR

      - name: Build Local
        if: env.EDITOR == 'local'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Build Online
        if: env.EDITOR == 'online'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.online.conf.json --bundles nsis

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = $env:VERSION
          $dir = "src-tauri/target/release/bundle/nsis"
          if ($env:EDITOR -eq "local") {
            $setup = Join-Path $dir "Moyue_${version}_x64-setup.exe"
            $asset = "Moyue_${version}_x64-setup.exe"
            $manifestAsset = "latest.json"
            $ossUrl = "https://moyue-release-files.oss-cn-hangzhou.aliyuncs.com/updates/Moyue_${version}_x64-setup.exe"
            $ossPrefix = "updates"
          } else {
            $setup = Join-Path $dir "Moyue Online_${version}_x64-setup.exe"
            $asset = "Moyue.Online_${version}_x64-setup.exe"
            $manifestAsset = "latest-online.json"
            # The OSS object is uploaded under $asset (dot), so the manifest
            # must use the same name; a space-encoded name returns 404.
            $ossUrl = "https://moyue-release-files.oss-cn-hangzhou.aliyuncs.com/updates/online/Moyue.Online_${version}_x64-setup.exe"
            $ossPrefix = "updates/online"
          }
          if (-not (Test-Path $setup)) { throw "installer not found: $setup" }
          $signature = (Get-Content "$setup.sig" -Raw).Trim()
          $manifest = [ordered]@{
            version = $version
            notes = "墨阅 $($env:EDITOR) $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $signature; url = $ossUrl }
            }
          }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $setup "release-assets/$asset"
          Copy-Item "$setup.sig" "release-assets/$asset.sig"
          [System.IO.File]::WriteAllText(
            "release-assets/$manifestAsset",
            ($manifest | ConvertTo-Json -Depth 6 -Compress),
            (New-Object System.Text.UTF8Encoding($false))
          )
          "OSS_PREFIX=$ossPrefix" | Out-File $env:GITHUB_ENV -Append
          "INSTALLER=$asset" | Out-File $env:GITHUB_ENV -Append
          "MANIFEST=$manifestAsset" | Out-File $env:GITHUB_ENV -Append

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-running a release (for example to repair an update manifest)
            # must replace the existing assets instead of creating a duplicate.
            gh release upload $env:TAG "release-assets/$env:INSTALLER" "release-assets/$env:INSTALLER.sig" "release-assets/$env:MANIFEST" --clobber
          } else {
            gh release create $env:TAG "release-assets/$env:INSTALLER" "release-assets/$env:INSTALLER.sig" "release-assets/$env:MANIFEST" --title "Moyue $env:EDITOR $env:VERSION" --notes "Moyue $env:EDITOR $env:VERSION" --latest
          }

      - name: Publish rolling update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rolling = if ($env:EDITOR -eq "local") { "latest-local" } else { "latest-online" }
          gh release view $rolling *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $rolling --title "Moyue $env:EDITOR latest" --notes "滚动更新清单，仅供应用检查更新。" --latest=false
          }
          gh release upload $rolling "release-assets/$env:MANIFEST" --clobber

      - name: Upload OSS
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          python -m pip install --quiet oss2
          @'
          import os, oss2
          auth = oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"])
          bucket = oss2.Bucket(auth, "https://oss-cn-hangzhou.aliyuncs.com", "moyue-release-files")
          prefix = os.environ["OSS_PREFIX"]
          installer = os.environ["INSTALLER"]
          manifest = os.environ["MANIFEST"]
          bucket.put_object_from_file(f"{prefix}/{installer}", f"release-assets/{installer}")
          bucket.put_object_from_file(f"{prefix}/{installer}.sig", f"release-assets/{installer}.sig")
          bucket.put_object_from_file(f"{prefix}/latest.json", f"release-assets/{manifest}")
          print("uploaded", prefix)
          '@ | python -
